<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kept Things — 学习看板</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=Caveat:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <div class="eyebrow">A Field Guide · Vol. 3</div>
      <h1>Kept things</h1>
    </div>
    <div class="hand">For: moi.<br>Un module, une envie.<br>把想学的都别在这里 ↷</div>
  </header>
  <div class="toolbar">
    <button class="tb" id="btnToday" title="新建一个以今天日期命名的待办模块">+ Today</button>
    <button class="tb" id="btnPip" title="弹出置顶迷你清单（Chrome/Edge）">📌 Mini</button>
    <button class="tb" id="btnExport" title="下载 JSON 备份">↧ Export</button>
    <button class="tb" id="btnImport" title="从 JSON 备份恢复">↥ Import</button>
    <input type="file" id="importFile" accept=".json" style="display:none">
  </div>
  <p class="hint">把 <b>PDF/EPUB 文件</b> 拖进卡片，或在卡片底部粘贴链接（支持多行，链接和纯文字都行）后按回车 —— 没有链接的文字会变成一条备忘/待办。网页标题会自动抓取，抓不到就保留推断名，点 ✎ 可改。</p>

  <div class="board" id="board"></div>

  <footer>
    <span>North Field Office</span>
    <span id="storemode">已连接本地服务器 ✓</span>
    <span id="pgno">—</span>
  </footer>
</div>
<div class="toast" id="toast"></div>

<svg width="0" height="0" style="position:absolute">
  <defs>
    <g id="pinShape">
      <path d="M4 22 Q2 26 5 28 Q8 30 10 26 L26 6 Q28 3 25 1.5 Q22 0 20 3 L7 20" fill="none" stroke="#1E2AA8" stroke-width="2.4" stroke-linecap="round"/>
      <circle cx="5.5" cy="26.5" r="3.6" fill="none" stroke="#1E2AA8" stroke-width="2.2"/>
    </g>
  </defs>
</svg>

<script src="/js/common.js"></script>
<script src="/js/app.js"></script>
</body>
</html>
